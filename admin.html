<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>لوحة الإدارة</title>

  <!-- حماية الإدارة -->
  <script type="module" src="admin-guard.js"></script>

  <!-- منطق الصفحة -->
  <script type="module" src="admin.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
    }

    .box {
      background: white;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    label {
      display: block;
      margin-top: 10px;
      font-weight: bold;
    }

    input, button {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      font-size: 14px;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 15px;
    }

    button:hover {
      background: #1e40af;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      border-bottom: 1px solid #ddd;
      padding: 8px;
      text-align: center;
    }

    th {
      background: #f1f5f9;
    }

    .manager {
      background: #eef2ff;
    }

    .danger {
      background: #dc2626;
    }

    .danger:hover {
      background: #991b1b;
    }
  </style>
</head>
<body>

<h1>👨‍💼 لوحة الإدارة</h1>

<!-- إضافة موظف -->
<div class="box">
  <h3>➕ إضافة موظف</h3>

  <label>اسم الموظف</label>
  <input id="empName" />

  <label>رقم الموظف</label>
  <input id="empCode" />

  <label>
    <input type="checkbox" id="isManager" /> مدير
  </label>

  <label>رقم المدير (إن وجد)</label>
  <input id="empPin" />

  <button onclick="addEmployee()">💾 حفظ الموظف</button>
</div>

<!-- قائمة الموظفين -->
<div class="box">
  <h3>👥 الموظفون</h3>
  <div id="employeesList"></div>
</div>

<!-- إدارة الكوبونات -->
<div class="box">
  <h3>🎟️ كوبون الموظف (شهري)</h3>

  <label>رقم الموظف</label>
  <input id="couponEmpCode" />

  <label>المبلغ الشهري</label>
  <input id="couponAmount" type="number" step="0.001" />

  <button onclick="setCoupon()">💾 حفظ الكوبون</button>
</div>

<!-- أزرار -->
<div class="box">
  <button onclick="backToCashier()">⬅️ رجوع للكاشير</button>
</div>

</body>
</html>
