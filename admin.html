<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>لوحة الإدارة</title>

  <!-- حماية -->
  <script type="module" src="admin-guard.js"></script>
  <script type="module" src="admin.js"></script>

  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --primary: #4f46e5;
      --danger: #dc2626;
      --muted: #64748b;
      --border: #e5e7eb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: var(--bg);
      color: #111827;
    }

    /* ===== Top Bar ===== */
    .topbar {
      background: var(--card);
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }

    .topbar h1 {
      margin: 0;
      font-size: 20px;
    }

    .topbar button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }

    /* ===== Layout ===== */
    .container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      padding: 20px;
    }

    .card {
      background: var(--card);
      border-radius: 10px;
      padding: 16px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    .card h2 {
      margin-top: 0;
      margin-bottom: 14px;
      font-size: 18px;
    }

    label {
      font-size: 13px;
      color: var(--muted);
      margin-top: 10px;
      display: block;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 4px;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-size: 14px;
    }

    button.action {
      width: 100%;
      margin-top: 14px;
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    /* ===== Employee List ===== */
    .employee {
      border-bottom: 1px dashed var(--border);
      padding: 10px 0;
    }

    .employee:last-child {
      border-bottom: none;
    }

    .employee .name {
      font-weight: 700;
    }

    .badge {
      display: inline-block;
      margin-top: 4px;
      font-size: 12px;
      padding: 2px 6px;
      border-radius: 4px;
      background: #e0e7ff;
      color: #3730a3;
    }

    .danger {
      background: var(--danger);
      margin-top: 6px;
    }
  </style>
</head>

<body>

  <!-- Top Bar -->
  <div class="topbar">
    <h1>👨‍💼 لوحة الإدارة</h1>
    <button onclick="backToCashier()">⬅️ الرجوع للكاشير</button>
  </div>

  <div class="container">

    <!-- Employees -->
    <div class="card">
      <h2>👥 إدارة الموظفين</h2>

      <label>اسم الموظف</label>
      <input id="empName">

      <label>رقم الموظف</label>
      <input id="empCode">

      <label>رقم المدير (اختياري)</label>
      <input id="empPin">

      <label>
        <input type="checkbox" id="isManager"> مدير
      </label>

      <button class="action" onclick="addEmployee()">➕ إضافة موظف</button>

      <hr style="margin:20px 0">

      <div id="employeesList"></div>
    </div>

    <!-- Coupons -->
    <div class="card">
      <h2>🎟️ كوبونات الموظفين</h2>

      <label>رقم الموظف</label>
      <input id="couponEmpCode">

      <label>المبلغ الشهري</label>
      <input id="couponAmount" type="number" step="0.001">

      <button class="action" onclick="setCoupon()">💾 حفظ الكوبون</button>
    </div>

  </div>

</body>
</html>
