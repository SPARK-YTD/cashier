<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>لوحة الإدارة</title>

  <!-- 🛡️ حماية -->
  <script type="module" src="admin-guard.js"></script>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

<header class="topbar">
  <h2>👨‍💼 لوحة الإدارة</h2>
  <button onclick="logout()">🚪 خروج</button>
</header>

<main style="padding:20px">

  <!-- إضافة موظف -->
  <section class="card">
    <h3>➕ إضافة موظف</h3>

    <input id="empName" placeholder="اسم الموظف" />
    <input id="empCode" placeholder="رقم الموظف" />
    <input id="empPin" placeholder="PIN المدير (اختياري)" />

    <label>
      <input type="checkbox" id="isManager" />
      مدير
    </label>

    <button onclick="addEmployee()">حفظ</button>
  </section>

  <!-- قائمة الموظفين -->
  <section class="card">
    <h3>👥 الموظفين</h3>
    <div id="employeesList"></div>
  </section>

</main>

<script type="module" src="admin.js"></script>
</body>
</html>

<section class="card">
  <h3>🎟️ كوبونات الموظفين</h3>

  <select id="couponEmployee"></select>
  <input id="couponAmount" type="number" step="0.001" placeholder="المبلغ الشهري" />

  <button onclick="setCoupon()">💾 حفظ / تحديث</button>
</section>
