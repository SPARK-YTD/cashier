<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>إدارة الأصناف</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  ⚙️ إدارة الأصناف
</header>

<main class="card" style="max-width:900px;margin:20px auto">

  <!-- ===== تسجيل الدخول ===== -->
  <div id="loginBox">
    <h3>تسجيل الدخول</h3>
    <input type="password" id="adminPass" placeholder="كلمة المرور">
    <button class="btn success" onclick="login()">دخول</button>
  </div>

  <!-- ===== لوحة الإدارة ===== -->
  <div id="adminPanel" style="display:none">

    <h3>➕ إضافة صنف</h3>

    <input id="itemName" placeholder="اسم الصنف">

    <input
      id="itemPrice"
      type="number"
      step="0.001"
      placeholder="السعر (بدون أحجام)"
    >

    <select id="itemCategory">
      <option value="food">🍔 طعام</option>
      <option value="drinks">🥤 مشروبات</option>
      <option value="sides">🍟 جانبية</option>
    </select>

    <input type="file" id="itemImage" accept="image/*">
      
      
<!-- ===== نوع الصنف ===== -->
<div style="margin-top:15px;padding:10px;border:1px dashed #ccc;border-radius:8px">
  <strong>نوع الصنف:</strong><br>

<label style="margin-left:15px">
  <input type="radio" name="itemType" value="normal">
  🍽️ صنف عادي (بدون أحجام)
</label>

<label style="margin-left:15px">
  <input type="radio" name="itemType" value="sizes" checked>
  🍲 طبق (أحجام)
</label>

<label>
  <input type="radio" name="itemType" value="burger">
  🍔 برقر (عادي / وجبة)
</label>
</div>
<!-- ===== سبايسي ===== -->
<div style="margin-top:15px;padding:10px;border:1px dashed #f87171;border-radius:8px">
  <label style="font-weight:700;color:#dc2626">
    <input type="checkbox" id="itemSpicy">
    🌶 سبايسي
  </label>
</div>
    <!-- ===== دعم الأحجام ===== -->
    <div style="margin-top:15px;padding:10px;border:1px dashed #ccc;border-radius:8px">

      <div id="variantsBox" style="margin-top:10px">
      
        <div class="variant-row">
<span class="variant-label">Small</span>
  <input id="priceSmall" type="number" step="0.001" placeholder="السعر">
</div>

<div class="variant-row">
<span class="variant-label">Medium</span>
  <input id="priceMedium" type="number" step="0.001" placeholder="السعر">
</div>

<div class="variant-row">
<span class="variant-label">Large</span>
  <input id="priceLarge" type="number" step="0.001" placeholder="السعر">
</div>
      </div>
    </div>
    
    <!-- ===== المواد الاستهلاكية ===== -->
<div style="margin-top:15px;padding:10px;border:1px dashed #0ea5e9;border-radius:8px">
  <strong>📦 المواد الاستهلاكية لهذا الصنف</strong>

  <div id="consumablesBox" style="margin-top:10px"></div>

  <button
    type="button"
    class="btn secondary"
    onclick="addConsumableRow()"
    style="margin-top:10px"
  >
    ➕ إضافة مادة استهلاكية
  </button>
</div>
    

    <!-- ===== تقسيم النسبة بين عدة موظفين ===== -->
<div style="margin-top:15px;padding:10px;border:1px dashed #6366f1;border-radius:8px">
  <strong>👥 تقسيم النسبة بين عدة موظفين</strong>

  <div id="multiEmployeesBox" style="margin-top:10px"></div>

  <button
    type="button"
    class="btn secondary"
    onclick="addMultiEmployeeRow()"
    style="margin-top:10px"
  >
    ➕ إضافة موظف
  </button>

  <p style="font-size:12px;color:#666;margin-top:8px">
    يجب أن يكون مجموع النسب 100%
  </p>
</div>
  
    <button class="btn success" onclick="addItem()">💾 حفظ الصنف</button>

    <hr>

<h4>➖ إضافات داخلية (يمكن إزالتها)</h4>
<p style="font-size:13px;color:#555">
اكتب كل إضافة في سطر (مثال: خس، خيار، مايونيز)
</p>

<textarea
  id="itemExtras"
  rows="4"
  placeholder="خس
طماطم
خيار
مايونيز"
  style="width:100%;padding:10px;border-radius:8px;border:1px solid #ccc"
></textarea>

    <h3>📋 الأصناف الحالية</h3>
    <div id="itemsList"></div>

    <hr>

<button
  id="backBtn"
  class="btn secondary fixed-back"
  onclick="goBack()"
  style="display:none"
>
  ⬅ رجوع للكاشير
</button>

  </div>

</main>

<script type="module" src="auth-guard.js"></script>
<script type="module" src="settings.js"></script>

<!-- سكربت التحكم بنوع الصنف -->
<script>
const typeRadios = document.querySelectorAll('input[name="itemType"]');
const variantsBox = document.getElementById("variantsBox");
const itemPrice = document.getElementById("itemPrice");

const labels = document.querySelectorAll(".variant-label");
const rows = document.querySelectorAll(".variant-row");

function updateUI(type) {
  if (type === "normal") {
    variantsBox.style.display = "none";
    itemPrice.style.display = "block";
  } else {
    variantsBox.style.display = "block";
    itemPrice.style.display = "none";
  }

  if (type === "burger") {
    labels[0].textContent = "عادي";
    labels[1].textContent = "وجبة";
    rows[2].style.display = "none";
  } else {
    labels[0].textContent = "Small";
    labels[1].textContent = "Medium";
    labels[2].textContent = "Large";
    rows[2].style.display = "flex";
  }
}

typeRadios.forEach(radio => {
  radio.addEventListener("change", e => updateUI(e.target.value));
});

updateUI(
  document.querySelector('input[name="itemType"]:checked').value
);

</script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
</body>
</html>
