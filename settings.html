<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>إدارة الأصناف</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  ⚙️ إدارة الأصناف
</header>

<main class="card" style="max-width:900px;margin:20px auto">

  <!-- ===== تسجيل الدخول ===== -->
  <div id="loginBox">
    <h3>تسجيل الدخول</h3>
    <input type="password" id="adminPass" placeholder="كلمة المرور">
    <button class="btn success" onclick="login()">دخول</button>
  </div>

  <!-- ===== لوحة الإدارة ===== -->
  <div id="adminPanel" style="display:none">

    <h3>➕ إضافة صنف</h3>

    <input id="itemName" placeholder="اسم الصنف">

    <input
      id="itemPrice"
      type="number"
      step="0.001"
      placeholder="السعر (بدون أحجام)"
    >

    <select id="itemCategory">
      <option value="food">🍔 طعام</option>
      <option value="drinks">🥤 مشروبات</option>
      <option value="sides">🍟 جانبية</option>
    </select>

    <input type="file" id="itemImage" accept="image/*">
<!-- ===== نوع الصنف ===== -->
<div style="margin-top:15px;padding:10px;border:1px dashed #ccc;border-radius:8px">
  <strong>نوع الصنف:</strong><br>

  <label style="margin-left:15px">
    <input type="radio" name="itemType" value="dish" checked>
    🍲 طبق (أحجام)
  </label>

  <label>
    <input type="radio" name="itemType" value="burger">
    🍔 برقر (عادي / وجبة)
  </label>
</div>
    <!-- ===== دعم الأحجام ===== -->
    <div style="margin-top:15px;padding:10px;border:1px dashed #ccc;border-radius:8px">

      <label style="display:flex;gap:8px;align-items:center">
        <input type="checkbox" id="hasVariants">
        <strong>الصنف له عدة أحجام</strong>
      </label>

      <div id="variantsBox" style="display:none;margin-top:10px">

        <div class="variant-row">
<label class="variant-label">الخيار 1</label>
          <input type="number" step="0.001" id="priceSmall">
        </div>

        <div class="variant-row">
<label class="variant-label">الخيار 2</label>
          <input type="number" step="0.001" id="priceMedium">
        </div>

        <div class="variant-row">
<label class="variant-label">الخيار 3</label>
          <input type="number" step="0.001" id="priceLarge">
        </div>

      </div>
    </div>

    <button class="btn success" onclick="addItem()">💾 حفظ الصنف</button>

    <hr>

<h4>➖ إضافات داخلية (يمكن إزالتها)</h4>
<p style="font-size:13px;color:#555">
اكتب كل إضافة في سطر (مثال: خس، خيار، مايونيز)
</p>

<textarea
  id="itemExtras"
  rows="4"
  placeholder="خس
طماطم
خيار
مايونيز"
  style="width:100%;padding:10px;border-radius:8px;border:1px solid #ccc"
></textarea>

    <h3>📋 الأصناف الحالية</h3>
    <div id="itemsList"></div>

    <hr>

<button
  id="backBtn"
  class="btn secondary fixed-back"
  onclick="goBack()"
  style="display:none"
>
  ⬅ رجوع للكاشير
</button>

  </div>

</main>

<script type="module" src="settings.js"></script>


<script>
  const hasVariants = document.getElementById("hasVariants");
  const variantsBox = document.getElementById("variantsBox");

  hasVariants.addEventListener("change", () => {
    variantsBox.style.display = hasVariants.checked ? "block" : "none";
  });
</script>

<!-- ⬇️ الصق السكربت هنا بالضبط -->
<script>
  const typeRadios = document.querySelectorAll('input[name="itemType"]');
  const labels = document.querySelectorAll(".variant-label");
  const variantRows = document.querySelectorAll(".variant-row");

  function updateVariantLabels(type) {
    if (type === "burger") {
      labels[0].textContent = "عادي";
      labels[1].textContent = "وجبة";
      variantRows[2].style.display = "none";
    } else {
      labels[0].textContent = "0.500";
      labels[1].textContent = "1.000";
      labels[2].textContent = "1.500";
      variantRows[2].style.display = "flex";
    }
  }

  typeRadios.forEach(radio => {
    radio.addEventListener("change", e => {
      updateVariantLabels(e.target.value);
    });
  });

  updateVariantLabels("dish");
</script>

</body>
</html>
