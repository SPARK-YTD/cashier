<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>📊 تقرير الكوبونات الشهرية</title>
  <script type="module" src="coupon-report.js"></script>

  <style>
    body {
      font-family: Tahoma, Arial;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    .top-bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }

    input, select, button {
      padding: 8px 10px;
      font-size: 14px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid #ddd;
      text-align: center;
    }

    th {
      background: #111827;
      color: white;
    }

    .status-ok {
      color: #16a34a;
      font-weight: bold;
    }

    .status-full {
      color: #dc2626;
      font-weight: bold;
    }

    .status-none {
      color: #6b7280;
    }

    .back-btn {
      background: #2563eb;
      color: white;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>📊 تقرير الكوبونات الشهرية</h1>

  <div class="top-bar">
    <input type="month" id="monthPicker">
    <input type="text" id="searchInput" placeholder="🔍 رقم الموظف">
    <button class="back-btn" onclick="goBack()">⬅ رجوع للإدارة</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>رقم الموظف</th>
        <th>قيمة الكوبون</th>
        <th>المصروف</th>
        <th>المتبقي</th>
        <th>نسبة الاستخدام</th>
        <th>الحالة</th>
      </tr>
    </thead>
    <tbody id="reportBody">
      <tr>
        <td colspan="6">⏳ جاري التحميل...</td>
      </tr>
    </tbody>
  </table>

</body>
</html>
