<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>المخزون</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">
  📦 إدارة المخزون
</header>
<button class="btn" onclick="goBackToCashier()">
  ⬅️ رجوع للكاشير
</button>

<main class="card" style="max-width:900px;margin:20px auto">

  <!-- إضافة مادة -->
  <h3>➕ إضافة مادة استهلاكية</h3>

  <input id="consumableName" placeholder="اسم المادة (كيس / كوب / صحن)">

  <button class="btn success" onclick="addConsumable()">
    💾 حفظ المادة
  </button>

  <hr>

  <!-- إضافة كمية -->
  <h3>📥 إضافة كمية للمخزون</h3>

  <select id="stockConsumable"></select>

  <select id="sizeSelect">
  <option value="Normal">Normal</option>
  <option value="Small">Small</option>
  <option value="Medium">Medium</option>
  <option value="Large">Large</option>
</select>

  <input id="stockQty" type="number" placeholder="الكمية">

  <button class="btn secondary" onclick="addStock()">
    ➕ إضافة كمية
  </button>

  <hr>

  <!-- عرض المخزون -->
  <h3>📊 المخزون الحالي</h3>
  <div id="stockList"></div>

</main>

<script type="module" src="storage.js"></script>
</body>
</html>
