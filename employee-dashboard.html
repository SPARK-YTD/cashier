<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>لوحة الموظف</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      margin: 0;
      padding: 20px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    h2 {
      margin: 0;
    }

    button {
      padding: 8px 14px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    .logout {
      background: #dc2626;
      color: white;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.08);
      margin-bottom: 15px;
    }

    .stat {
      font-size: 18px;
      font-weight: bold;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <h2>👨‍🍳 <span id="employeeName"></span></h2>
    <button class="logout" onclick="logoutEmployee()">تسجيل خروج</button>
  </div>

  <div class="card">
    <label>عرض الإحصائيات حسب:</label>
    <select id="timeFilter" onchange="loadStats()">
      <option value="all">كل الوقت</option>
      <option value="today">اليوم</option>
      <option value="month">هذا الشهر</option>
    </select>
  </div>

  <div class="card">
    <div>عدد الطلبات المرتبطة بك:</div>
    <div class="stat" id="ordersCount">0</div>
  </div>

  <div class="card">
    <div>إجمالي المبيعات المرتبطة بك:</div>
    <div class="stat" id="totalSales">0.000 د.ب</div>
  </div>
      <div class="card">
        <h3>تفصيل المبيعات حسب القسم:</h3>
        <p>🍔 الطعام: <span id="foodCount">0</span></p>
        <p>🥤 المشروبات: <span id="drinksCount">0</span></p>
        <p>🍟 الجانبية: <span id="sidesCount">0</span></p>
   </div>

   <div class="card">
        <h3>الأصناف المرتبطة بك:</h3>
        <div id="linkedProductsCount">0 صنف</div>
        <ul id="linkedProductsList" style="margin-top:10px;padding-right:20px;"></ul>
    </div>
    
    <div class="card">
        <h3>تفصيل المبيعات حسب الصنف:</h3>
        <ul id="productSalesList" style="margin-top:10px;padding-right:20px;"></ul>
    </div>
    
  <script src="employee-guard.js"></script>
  <script type="module" src="employee-dashboard.js"></script>

</body>
</html>
