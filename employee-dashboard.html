<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>لوحة الموظف</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Cairo', sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #fff;
      padding: 25px;
    }

    .container {
      max-width: 1200px;
      margin: auto;
    }

    /* ===== Header ===== */

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .header h2 {
      font-weight: 800;
      font-size: 22px;
    }

    .logout {
      background: #ef4444;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      color: white;
      cursor: pointer;
      font-weight: 600;
      transition: 0.3s;
    }

    .logout:hover {
      background: #dc2626;
      transform: translateY(-2px);
    }

    /* ===== Cards Grid ===== */

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 25px;
    }

    .card {
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(10px);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    .card h3 {
      margin-top: 0;
      font-size: 15px;
      font-weight: 600;
      color: #cbd5e1;
    }

    .stat {
      font-size: 28px;
      font-weight: 800;
      margin-top: 8px;
      color: #fff;
    }

    /* ===== Filter ===== */

    .filter-box {
      margin-bottom: 20px;
    }

    select, input[type="date"] {
      padding: 8px 10px;
      border-radius: 8px;
      border: none;
      margin-left: 5px;
      font-family: inherit;
    }

    .apply-btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    /* ===== Lists ===== */

    ul {
      list-style: none;
      padding: 0;
      margin: 10px 0 0 0;
    }

    ul li {
      background: rgba(255,255,255,0.08);
      padding: 10px 12px;
      border-radius: 10px;
      margin-bottom: 8px;
      font-size: 14px;
      display: flex;
      justify-content: space-between;
    }

    .highlight {
      background: linear-gradient(90deg, #f59e0b, #f97316);
      font-weight: 800;
    }

    /* ===== Section Title ===== */

    .section-title {
      font-weight: 700;
      margin-bottom: 10px;
      font-size: 16px;
      color: #e2e8f0;
    }

  </style>
</head>
<body>

<div class="container">

  <!-- Header -->
  <div class="header">
    <h2>👨‍🍳 <span id="employeeName"></span></h2>
    <button class="logout" onclick="logoutEmployee()">تسجيل خروج</button>
  </div>

  <!-- Filter -->
  <div class="card filter-box">
    <label>عرض حسب:</label>
    <select id="timeFilter" onchange="loadStats()">
      <option value="all">كل الوقت</option>
      <option value="today">اليوم</option>
      <option value="month">هذا الشهر</option>
      <option value="custom">فترة مخصصة</option>
    </select>

    <div id="customDateBox" style="margin-top:10px; display:none;">
      من:
      <input type="date" id="dateFrom">
      إلى:
      <input type="date" id="dateTo">
      <button class="apply-btn" onclick="loadStats()">تطبيق</button>
    </div>
  </div>

  <!-- Stats -->
  <div class="grid">
    <div class="card">
      <h3>عدد الطلبات</h3>
      <div class="stat" id="ordersCount">0</div>
    </div>

    <div class="card">
      <h3>إجمالي المبيعات</h3>
      <div class="stat" id="totalSales">0.000 د.ب</div>
    </div>

    <div class="card">
      <h3>🍔 الطعام</h3>
      <div class="stat" id="foodCount">0</div>
    </div>

    <div class="card">
      <h3>🥤 المشروبات</h3>
      <div class="stat" id="drinksCount">0</div>
    </div>

    <div class="card">
      <h3>🍟 الجانبية</h3>
      <div class="stat" id="sidesCount">0</div>
    </div>
  </div>

  <!-- Linked Products -->
  <div class="card">
    <div class="section-title">
      الأصناف المرتبطة بك (<span id="linkedProductsCount">0</span>)
    </div>
    <ul id="linkedProductsList"></ul>
  </div>

  <!-- Product Sales -->
  <div class="card">
    <div class="section-title">تفصيل المبيعات حسب الصنف</div>
    <ul id="productSalesList"></ul>
  </div>

</div>

<script src="employee-guard.js"></script>
<script type="module" src="employee-dashboard.js"></script>

<script>
  // إظهار/إخفاء فلترة مخصصة
  document.getElementById("timeFilter").addEventListener("change", function () {
    document.getElementById("customDateBox").style.display =
      this.value === "custom" ? "block" : "none";
  });
</script>

</body>
</html>
