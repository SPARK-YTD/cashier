<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>لوحة الموظف</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      font-family: system-ui;
      background: #f1f5f9;
      padding: 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-top: 20px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    button {
      padding: 8px 14px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
    }

    .logout {
      background: #ef4444;
      color: white;
    }
  </style>
</head>

<body>

  <div class="header">
    <h2 id="empName"></h2>
    <button class="logout" onclick="logout()">تسجيل خروج</button>
  </div>

  <div class="card">
    <h3>📊 ملخص مبيعاتي</h3>
    <div id="mySalesResult">⏳ جاري التحميل...</div>
  </div>

<script type="module" src="employee-panel.js"></script>
</body>
</html>
