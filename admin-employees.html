<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<title>إدارة الموظفين</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">

<style>
body{
  font-family:'Cairo',sans-serif;
  background:#f4f6f9;
  margin:0;
  padding:25px;
}

.container{
  max-width:1000px;
  margin:auto;
}

h2{
  margin-bottom:20px;
}

button{
  padding:8px 14px;
  border:none;
  border-radius:6px;
  cursor:pointer;
  font-family:inherit;
}

.primary{background:#3b82f6;color:white;}
.danger{background:#ef4444;color:white;}
.success{background:#10b981;color:white;}
.gray{background:#6b7280;color:white;}

table{
  width:100%;
  border-collapse:collapse;
  background:white;
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 4px 15px rgba(0,0,0,0.05);
}

th,td{
  padding:12px;
  text-align:center;
  border-bottom:1px solid #eee;
}

th{
  background:#f9fafb;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.4);
  display:none;
  align-items:center;
  justify-content:center;
}

.modal-content{
  background:white;
  padding:20px;
  border-radius:10px;
  width:300px;
}

input,select{
  width:100%;
  padding:8px;
  margin-bottom:10px;
  border-radius:6px;
  border:1px solid #ddd;
}
</style>
</head>
<body>

<div class="container">
  <h2>👥 إدارة الموظفين</h2>

  <button class="primary" onclick="openModal()">➕ إضافة موظف</button>

  <br><br>

  <table>
    <thead>
      <tr>
        <th>الاسم</th>
        <th>الرقم الوظيفي</th>
        <th>الدور</th>
        <th>الحالة</th>
        <th>إجراءات</th>
      </tr>
    </thead>
    <tbody id="employeesTable"></tbody>
  </table>
</div>

<!-- Modal -->
<div class="modal" id="employeeModal">
  <div class="modal-content">
    <h3>إضافة موظف</h3>

    <input type="text" id="empName" placeholder="اسم الموظف">
    <input type="text" id="empCode" placeholder="الرقم الوظيفي">
    <input type="text" id="empPin" placeholder="كلمة المرور">

    <select id="empRole">
      <option value="employee">موظف</option>
      <option value="manager">مدير</option>
    </select>

    <button class="success" onclick="saveEmployee()">حفظ</button>
    <button class="gray" onclick="closeModal()">إلغاء</button>
  </div>
</div>

<script>
const adminSession = sessionStorage.getItem("admin_session");
if (!adminSession) {
  window.location.href = "admin-login.html";
}
</script>

<script type="module" src="admin-employees.js"></script>

</body>
</html>
