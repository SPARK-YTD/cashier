<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<title>لوحة إدارة الموظفين</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">

<style>
body{
  font-family:'Cairo',sans-serif;
  background:#f1f5f9;
  margin:0;
  padding:30px;
}

.container{
  max-width:1200px;
  margin:auto;
}

h1{
  margin-bottom:25px;
  font-weight:800;
}

/* ================= Dashboard ================= */

.dashboard{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
  margin-bottom:25px;
}

.card{
  background:white;
  padding:20px;
  border-radius:14px;
  box-shadow:0 6px 20px rgba(0,0,0,0.05);
  text-align:center;
}

.card h3{
  margin:0;
  font-size:14px;
  color:#64748b;
}

.card strong{
  font-size:22px;
  display:block;
  margin-top:8px;
}

/* ================= Top Actions ================= */

.top-actions{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

button{
  padding:8px 14px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-family:inherit;
  font-weight:600;
}

.primary{background:#2563eb;color:white;}
.success{background:#16a34a;color:white;}
.secondary{background:#7c3aed;color:white;}
.danger{background:#dc2626;color:white;}
.gray{background:#6b7280;color:white;}

/* ================= Table ================= */

table{
  width:100%;
  border-collapse:collapse;
  background:white;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 6px 20px rgba(0,0,0,0.05);
}

th,td{
  padding:14px;
  text-align:center;
  border-bottom:1px solid #eee;
}

th{
  background:#f8fafc;
  font-weight:700;
}

/* ================= Badges ================= */

.badge{
  padding:5px 10px;
  border-radius:20px;
  font-size:12px;
  font-weight:700;
}

.active{background:#dcfce7;color:#166534;}
.inactive{background:#fee2e2;color:#991b1b;}

/* ================= Modal ================= */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.4);
  display:none;
  align-items:center;
  justify-content:center;
}

.modal-content{
  background:white;
  padding:25px;
  border-radius:14px;
  width:360px;
}

input,select{
  width:100%;
  padding:8px;
  margin-bottom:12px;
  border-radius:8px;
  border:1px solid #ddd;
}

/* Overlay المستخدم في JS */
.variant-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.4);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:1000;
}

.variant-box{
  background:white;
  padding:25px;
  border-radius:14px;
  width:90%;
  max-width:500px;
}

.variant-btn{
  width:100%;
  margin-top:8px;
  padding:10px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  background:#2563eb;
  color:white;
  font-weight:600;
}

.variant-cancel{
  margin-top:10px;
  width:100%;
  padding:8px;
  border:none;
  border-radius:8px;
  background:#6b7280;
  color:white;
  cursor:pointer;
}
</style>
</head>
<body>

<div class="container">

  <h1>👥 لوحة إدارة الموظفين</h1>

  <!-- ================= Dashboard ================= -->
  <div class="dashboard">
    <div class="card">
      <h3>عدد الموظفين</h3>
      <strong id="totalEmployees">0</strong>
    </div>

    <div class="card">
      <h3>إجمالي كوبونات الشهر</h3>
      <strong id="totalCoupons">0.000</strong>
    </div>

    <div class="card">
      <h3>إجمالي الاستخدام</h3>
      <strong id="totalUsage">0.000</strong>
    </div>
  </div>

  <!-- ================= Actions ================= -->
  <div class="top-actions">
    <div></div>
    <button class="primary" onclick="openModal()">➕ إضافة موظف</button>
  </div>

  <!-- ================= Table ================= -->
  <table>
    <thead>
      <tr>
        <th>الاسم</th>
        <th>الرقم</th>
        <th>الدور</th>
        <th>الحالة</th>
        <th>الكوبون</th>
        <th>الإدارة</th>
      </tr>
    </thead>
    <tbody id="employeesTable"></tbody>
  </table>

</div>

<!-- ================= Add Employee Modal ================= -->

<div class="modal" id="employeeModal">
  <div class="modal-content">
    <h3>إضافة موظف</h3>

    <input id="empName" placeholder="اسم الموظف">
    <input id="empCode" placeholder="الرقم الوظيفي">
    <input id="empPin" placeholder="كلمة المرور">

    <select id="empRole">
      <option value="employee">موظف</option>
      <option value="manager">مدير</option>
    </select>

    <button class="success" onclick="saveEmployee()">حفظ</button>
    <button class="gray" onclick="closeModal()">إلغاء</button>
  </div>
</div>

<script>
const adminSession = sessionStorage.getItem("admin_session");
if (!adminSession) {
  window.location.href = "admin-login.html";
}
</script>

<script type="module" src="admin-employees.js"></script>

</body>
</html>
