<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>نظام الكاشير</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>

<header class="topbar">
  <span>نظام الكاشير</span>

  <!-- ☰ -->
  <div class="menu">
    <button id="menuBtn">☰</button>
    <div id="menuBox" class="menu-box hidden">
      <button onclick="closeDay()">📊 إقفال اليوم</button>
      <button onclick="goToReports()">📁 أرشيف التقارير</button>
      <button onclick="goToSettings()">⚙️ إدارة الأصناف</button>
    </div>
  </div>
</header>

<main class="cashier-layout">

  <!-- الأصناف -->
  <section class="card products">
    <h2>الأصناف</h2>
    <div class="categories">
      <button class="cat active" onclick="filterCategory('food',this)">🍔 طعام</button>
      <button class="cat" onclick="filterCategory('drinks',this)">🥤 مشروبات</button>
      <button class="cat" onclick="filterCategory('sides',this)">🍟 جانبية</button>
    </div>
    <div id="items" class="items-grid"></div>
  </section>

  <!-- الفاتورة -->
  <section class="card invoice">
    <h2>الفاتورة</h2>

    <table class="invoice-table">
      <thead>
        <tr>
          <th>الصنف</th>
          <th>الكمية</th>
          <th>المجموع</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="cart"></tbody>
    </table>

    <div class="total-box">
      الإجمالي: <span id="total">0.000</span> د.ب
    </div>

    <input id="paid" type="number" placeholder="المبلغ المدفوع">

    <div class="change-box">
      الباقي: <span id="change">—</span>
    </div>

    <button class="btn success" onclick="completeOrder()">إتمام الطلب</button>
  </section>

  <!-- الطلبات الجارية -->
  <section class="card orders">
    <h2>الطلبات الجارية</h2>
    <div id="activeOrders"></div>
  </section>

</main>

<script type="module" src="app.js"></script>
</body>
</html>
