<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title data-i18n="app_title"> كاشير خذ لك بريك 👨🏻‍🍳</title>
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>

<!-- ===== Top Bar ===== -->
<header class="topbar">
  <button class="menu-btn" onclick="toggleMenu()">☰</button>
  <span data-i18n="app_title"> كاشير خذ لك بريك 👨🏻‍🍳 </span>
  <span id="dayStatus" style="font-size:14px"></span>
</header>

<!-- ===== Side Menu ===== -->
<div id="sideMenu" class="side-menu" onclick="event.stopPropagation()">
  
  <button onclick="goToReports()">📁 أرشيف التقارير</button>
  <button onclick="closeDay()">📊 إقفال اليوم</button>
  <button onclick="goToSettings()">⚙️ إدارة الأصناف</button>
  <button onclick="openEmployeeMeals()">👨‍🍳 وجبات الموظفين</button>
  <button onclick="logout()">🚪 تسجيل خروج</button>
</div>

<div id="overlay" class="overlay" onclick="closeMenu()"></div>

<main class="cashier-layout">


<div id="employeeBanner" style="
  display:none;
  background:#14532d;
  color:white;
  padding:10px;
  font-weight:bold;
  text-align:center;
">
  👨‍🍳 وضع الموظف — الرصيد: <span id="employeeBalance"></span> د.ب
</div>
  <!-- الأصناف -->
  <section class="card products">
    <h2>الأصناف</h2>

    <div class="categories">
      <button class="cat active" onclick="filterCategory('food', this)">🍔 طعام</button>
      <button class="cat" onclick="filterCategory('drinks', this)">🥤 مشروبات</button>
      <button class="cat" onclick="filterCategory('sides', this)">🍟 جانبية</button>
    </div>

    <div id="items" class="items-grid"></div>
  </section>

  <!-- الفاتورة -->
  <section class="card invoice">
    <h2>الفاتورة</h2>

    <table class="invoice-table">
      <thead>
        <tr>
          <th>الصنف</th>
          <th>الكمية</th>
          <th>المجموع</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="cart"></tbody>
    </table>

    <div class="total-box">
      الإجمالي: <span id="total">0.000 د.ب</span>
    </div>

    <input id="paid" type="number" placeholder="المبلغ المدفوع" />

    <div class="change-box">
      الباقي: <span id="change">—</span>
    </div>

    <button class="btn success" onclick="completeOrder()">إتمام الطلب</button>
 <button class="btn secondary" onclick="printReceipt()">
🧾 طباعة الفاتورة
</button>
  </section>

  <!-- الطلبات الجارية -->
  <section class="card orders">
    <h2>الطلبات الجارية</h2>
    <div id="activeOrders" class="orders-list"></div>
  </section>

</main>

<script type="module" src="auth-guard.js"></script>
<script type="module" src="app.js"></script>

<script>
  function toggleMenu() {
    document.getElementById("sideMenu").classList.toggle("open");
    document.getElementById("overlay").classList.toggle("show");
  }
  function closeMenu() {
    document.getElementById("sideMenu").classList.remove("open");
    document.getElementById("overlay").classList.remove("show");
  }
</script>

<!-- ===== RECEIPT PRINT AREA ===== -->
<div id="printArea" class="print-area">
  <div class="receipt">

    <div class="title">خذ لك بريك</div>

    <!-- رقم الفاتورة -->
    <div class="receipt-no">
      فاتورة رقم: <span id="printReceiptNo"></span>
    </div>

    <hr>

    <div id="printItems"></div>

    <hr>

    <div class="total">
      الإجمالي: <span id="printTotal"></span>
    </div>

  </div>
</div>
