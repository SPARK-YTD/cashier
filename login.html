<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>تسجيل الدخول</title>
  <link rel="stylesheet" href="style.css">
</head>
<body style="display:flex;align-items:center;justify-content:center;height:100vh">

  <div class="card" style="max-width:360px;width:100%">
    <h2 style="text-align:center">تسجيل الدخول</h2>

    <input id="email" type="email" placeholder="البريد الإلكتروني" style="margin-bottom:10px">
    <input id="password" type="password" placeholder="كلمة المرور" style="margin-bottom:10px">

    <button class="btn success" onclick="login()">دخول</button>
  </div>

<script type="module">
  import { supabase } from "./supabase.js";

  window.login = async function () {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const { error } = await supabase.auth.signInWithPassword({
      email,
      password
    });

    if (error) {
      alert("بيانات الدخول غير صحيحة");
    } else {
      location.href = "index.html";
    }
  };
</script>

</body>
</html>
