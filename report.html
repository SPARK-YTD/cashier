<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>تقرير إقفال اليوم</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>

<body class="report-page">

  <!-- ===== Header ===== -->
  <header class="report-header">
    <h1>📊 تقرير إقفال اليوم</h1>
    <div class="store-name">Get-Break</div>
    <div class="close-time" id="closeTime">—</div>
  </header>

  <!-- ===== Content ===== -->
  <main class="report-container">

    <!-- ===== Summary Cards ===== -->
    <section class="summary-cards">

      <div class="card summary">
        <span>🧾 عدد الطلبات</span>
        <strong id="ordersCount">0</strong>
      </div>

      <div class="card summary highlight">
        <span>💰 إجمالي المبيعات</span>
        <strong id="totalSales">0.000 د.ب</strong>
      </div>

      <div class="card summary">
        <span>🥇 الأكثر مبيعًا</span>
        <strong id="topItem">—</strong>
      </div>

    </section>

    <!-- ===== Items Table ===== -->
    <section class="table-box">
      <h3 class="section-title">تفاصيل الأصناف</h3>

      <table class="report-table">
        <thead>
          <tr>
            <th>الصنف</th>
            <th>الكمية</th>
            <th>الإجمالي</th>
          </tr>
        </thead>
        <tbody id="itemsReport">
          <tr>
            <td colspan="3">—</td>
          </tr>
        </tbody>
      </table>
    </section>

    <!-- ===== Actions ===== -->
    <section class="actions no-print">

      <button class="btn success" onclick="downloadPDF()">
        🖨 طباعة / PDF
      </button>

      <button class="btn danger" onclick="startNewDay()">
        🔄 إقفال اليوم وبدء جديد
      </button>

      <button class="btn secondary" onclick="backToCashier()">
        ⬅ رجوع للكاشير
      </button>

    </section>

  </main>

  <!-- ===== Footer ===== -->
  <footer class="report-footer">
    هذا التقرير للمعاينة فقط — لن يتم الحفظ إلا بعد بدء يوم جديد
  </footer>

  <script type="module" src="report.js"></script>
</body>
</html>
