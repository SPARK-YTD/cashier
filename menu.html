<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المنيو - Get-Break</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #ffffff;
      font-family: 'Arial', sans-serif;
      padding-bottom: 100px;
      direction: rtl;
    }

    .header {
      background: #ffffff;
      color: #111827;
      padding: 16px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e5e5e5;
    }

    .header-title {
      font-size: 18px;
      font-weight: 700;
    }

    .header-right {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .timer-badge {
      background: #10B981;
      color: white;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 13px;
      font-family: 'Courier New', monospace;
      min-width: 60px;
      text-align: center;
      transition: background 0.3s;
    }

    .timer-badge.warning {
      background: #F59E0B;
    }

    .timer-badge.danger {
      background: #EF4444;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    .menu-icon {
      width: 30px;
      height: 30px;
      cursor: pointer;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 0;
    }

    .filters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 12px 16px;
      background: #f5f5f5;
      -webkit-overflow-scrolling: touch;
    }

    .filter-btn {
      background: #e5e5e5;
      color: #111827;
      border: none;
      padding: 10px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      white-space: nowrap;
      transition: all 0.3s;
      flex-shrink: 0;
    }

    .filter-btn.active {
      background: #D4A574;
      color: #000;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding: 16px;
      background: #ffffff;
    }

    .product-card {
      background: #ffffff;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.3s;
    }

    .product-card:hover {
      transform: translateY(-4px);
    }

    .product-img {
      width: 100%;
      height: 120px;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
    }

    .product-info {
      padding: 12px;
    }

    .product-name {
      font-weight: 600;
      color: #111827;
      font-size: 14px;
      margin-bottom: 4px;
    }

    .product-price {
      color: #10B981;
      font-weight: 700;
      font-size: 14px;
    }

    .cart-btn {
      position: fixed;
      bottom: 20px;
      left: 20px;
      right: 20px;
      background: #10B981;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      z-index: 50;
      box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3);
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      background: white;
      border-radius: 12px;
      width: 90%;
      max-width: 500px;
      max-height: 85vh;
      overflow-y: auto;
    }

    .modal-header {
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid #e5e5e5;
      position: relative;
    }

    .modal-header h2 {
      font-size: 20px;
      color: #111827;
      margin: 0;
    }

    .close-modal {
      position: absolute;
      top: 16px;
      right: 16px;
      background: #e5e5e5;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 18px;
    }

    .modal-body {
      padding: 20px;
    }

    .variant-btn {
      width: 100%;
      padding: 12px;
      background: #F4C34A;
      color: #000;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      margin-bottom: 10px;
    }

    .addon-item {
      display: flex;
      align-items: center;
      padding: 12px;
      background: #f9fafb;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      margin-bottom: 10px;
      cursor: pointer;
    }

    .addon-item input[type="checkbox"] {
      width: 20px;
      height: 20px;
      margin-left: 12px;
    }

    .addon-name {
      flex: 1;
      color: #111827;
      font-weight: 500;
      font-size: 13px;
    }

    .addon-price {
      color: #10B981;
      font-weight: 600;
      font-size: 12px;
    }

    .price-summary {
      background: #f9fafb;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 20px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      font-size: 13px;
    }

    .summary-row.total {
      border-top: 2px solid #e5e7eb;
      padding-top: 10px;
      font-weight: 700;
      font-size: 15px;
    }

    .modal-footer {
      padding: 16px 20px;
      display: flex;
      gap: 10px;
      border-top: 1px solid #e5e5e5;
    }

    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
    }

    .btn-cancel {
      background: #e5e7eb;
      color: #111827;
    }

    .btn-confirm {
      background: #F4C34A;
      color: #000;
    }

    .notification {
      position: fixed;
      top: 70px;
      right: 20px;
      left: 20px;
      background: #10B981;
      color: white;
      padding: 16px;
      border-radius: 8px;
      z-index: 999;
      display: none;
    }

    .notification.show {
      display: block;
    }

    .empty, .loading {
      text-align: center;
      padding: 40px 20px;
      color: #6B7280;
    }
  </style>
</head>
<body>

<div class="notification" id="notification"></div>

<div class="header">
  <span class="header-title">🍽️ المنيو</span>
  <div class="header-right">
    <span class="timer-badge" id="timerBadge">10:00</span>
  </div>
</div>

<div class="container">
  <div class="filters" id="filters"></div>
  <div class="grid" id="grid">
    <div class="loading">⏳ جاري التحميل...</div>
  </div>
</div>

<button class="cart-btn" onclick="showCart()">🛒 السلة <span id="badge" style="display:none;"></span></button>

<!-- MODALS -->
<div class="modal" id="variantModal">
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="variantTitle"></h2>
      <button class="close-modal" onclick="closeModal('variantModal')">✕</button>
    </div>
    <div class="modal-body" id="variantsBody"></div>
  </div>
</div>

<div class="modal" id="addonsModal">
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="addonsTitle"></h2>
      <button class="close-modal" onclick="closeModal('addonsModal')">✕</button>
    </div>
    <div class="modal-body">
      <div style="background: #f9fafb; padding: 12px; border-radius: 8px; margin-bottom: 16px;">
        السعر الأساسي: <strong id="basePrice"></strong>
      </div>
      <div id="addonsBody"></div>
      <div class="price-summary">
        <div class="summary-row total">
          <span>الإجمالي:</span>
          <span id="summaryTotal"></span>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-cancel" onclick="closeModal('addonsModal')">إلغاء</button>
      <button class="btn btn-confirm" onclick="confirmAddons()">أضف</button>
    </div>
  </div>
</div>

<div class="modal" id="cartModal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>🛒 السلة</h2>
      <button class="close-modal" onclick="closeModal('cartModal')">✕</button>
    </div>
    <div class="modal-body" id="cartBody"></div>
    <div class="modal-footer">
      <button class="btn btn-cancel" onclick="clearCart()">مسح</button>
      <button class="btn btn-confirm" onclick="goToOrder()">متابعة</button>
    </div>
  </div>
</div>

<div class="modal" id="orderModal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>📋 الطلب</h2>
      <button class="close-modal" onclick="closeModal('orderModal')">✕</button>
    </div>
    <div class="modal-body">
      <input type="text" id="customerName" placeholder="الاسم (اختياري)" style="width:100%; padding:10px; margin-bottom:12px; border:2px solid #e5e7eb; border-radius:6px;">
      <input type="tel" id="customerPhone" placeholder="الرقم" style="width:100%; padding:10px; margin-bottom:12px; border:2px solid #e5e7eb; border-radius:6px;">
      
      <label style="display:flex; gap:8px; margin-bottom:12px;">
        <input type="radio" name="orderType" value="pickup" checked onchange="updateDelivery()">
        <span>🚶 استلام</span>
      </label>
      <label style="display:flex; gap:8px; margin-bottom:12px;">
        <input type="radio" name="orderType" value="delivery" onchange="updateDelivery()">
        <span>🚗 توصيل</span>
      </label>

      <div id="deliveryGroup" style="display:none; margin-bottom:12px;">
        <select id="deliveryArea" style="width:100%; padding:10px; margin-bottom:8px; border:2px solid #e5e7eb; border-radius:6px;">
          <option value="">المنطقة</option>
          <option value="manama">المنامة - 300f</option>
          <option value="budaiya">البديع - 500f</option>
          <option value="other">أخرى - 1د</option>
        </select>
        <textarea id="deliveryAddress" placeholder="العنوان" rows="2" style="width:100%; padding:10px; border:2px solid #e5e7eb; border-radius:6px; font-family:inherit;"></textarea>
      </div>

      <textarea id="notes" placeholder="ملاحظات" rows="2" style="width:100%; padding:10px; margin-bottom:12px; border:2px solid #e5e7eb; border-radius:6px; font-family:inherit;"></textarea>
      
      <div class="price-summary">
        <div class="summary-row total">
          <span>الإجمالي:</span>
          <span id="orderTotal"></span>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-cancel" onclick="closeModal('orderModal')">إلغاء</button>
      <button class="btn btn-confirm" onclick="submitOrder()">إرسال</button>
    </div>
  </div>
</div>

<script type="module">
  import { supabase } from "./supabase.js";

  let sessionId = null, sessionExpireTime = null, timerInterval = null;
  const SESSION_TIMEOUT = 10 * 60 * 1000;
  let allProducts = [], cart = [], currentAddonsData = {};

  function initSession() {
    const savedId = localStorage.getItem("sessionId");
    const savedExp = localStorage.getItem("sessionExpireTime");
    const now = Date.now();

    if (savedId && savedExp && parseInt(savedExp) > now) {
      sessionId = savedId;
      sessionExpireTime = parseInt(savedExp);
    } else {
      sessionId = 'session_' + now + '_' + Math.random().toString(36).substr(2, 9);
      sessionExpireTime = now + SESSION_TIMEOUT;
      localStorage.setItem("sessionId", sessionId);
      localStorage.setItem("sessionExpireTime", sessionExpireTime);
    }

    startTimer();
  }

  function getCartKey() {
    return `cart_${sessionId}`;
  }

  function startTimer() {
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      const remaining = sessionExpireTime - Date.now();
      if (remaining <= 0) {
        expireSession();
      } else {
        const m = Math.floor(remaining / 60000);
        const s = Math.floor((remaining % 60000) / 1000);
        const display = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        const badge = document.getElementById("timerBadge");
        badge.textContent = display;
        badge.classList.remove('warning', 'danger');
        if (m === 0 && s <= 20) badge.classList.add('danger');
        else if (m === 0) badge.classList.add('warning');
      }
    }, 1000);
  }

  function expireSession() {
    clearInterval(timerInterval);
    if (cart.length > 0) {
      const cartKey = getCartKey();
      localStorage.removeItem(cartKey);
      autoSubmit();
    }
    localStorage.removeItem("sessionId");
    localStorage.removeItem("sessionExpireTime");
    showNotif("⏰ انتهت الجلسة!");
    setTimeout(() => location.reload(), 2000);
  }

  function autoSubmit() {
    const name = prompt("الاسم:") || "";
    const phone = prompt("الرقم:") || "";
    if (phone) {
      document.getElementById("customerName").value = name;
      document.getElementById("customerPhone").value = phone;
      setTimeout(() => submitOrder(), 500);
    }
  }

  function showNotif(msg) {
    const el = document.getElementById("notification");
    el.textContent = msg;
    el.classList.add("show");
    setTimeout(() => el.classList.remove("show"), 3000);
  }

  document.addEventListener("DOMContentLoaded", async () => {
    initSession();
    const { data } = await supabase.from("products").select("*").eq("active", true).eq("is_visible", true).order("sort_order");
    allProducts = data || [];
    renderFilters();
    renderProducts("all");
    loadCart();
  });

  function renderFilters() {
    const cats = [...new Set(allProducts.map(p => p.category || "أخرى"))];
    document.getElementById("filters").innerHTML = `
      <button class="filter-btn active" onclick="filterProducts('all')">الكل</button>
      ${cats.map(c => `<button class="filter-btn" onclick="filterProducts('${c}')">${c}</button>`).join("")}
    `;
  }

  window.filterProducts = (cat) => {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    event.target.classList.add("active");
    renderProducts(cat);
  };

  function renderProducts(cat) {
    const prods = cat === "all" ? allProducts : allProducts.filter(p => p.category === cat);
    if (!prods.length) {
      document.getElementById("grid").innerHTML = '<div class="empty">📭</div>';
      return;
    }
    document.getElementById("grid").innerHTML = prods.map(p => `
      <div class="product-card" onclick="addToCart('${p.id}','${p.name}',${p.price||0})">
        <div class="product-img">🍽️</div>
        <div class="product-info">
          <div class="product-name">${p.name}</div>
          <div class="product-price">${(p.price||0).toFixed(3)} د.ب</div>
        </div>
      </div>
    `).join("");
  }

  window.addToCart = async (productId, productName, price) => {
    const { data: variants } = await supabase.from("product_variants").select("*").eq("product_id", productId).eq("active", true);
    const { data: addons } = await supabase.from("product_addons").select("*").eq("product_id", productId).eq("active", true);
    const { data: prod } = await supabase.from("products").select("extras_list").eq("id", productId).single();

    let freeAddons = [];
    if (prod?.extras_list) {
      freeAddons = prod.extras_list.split("\n").map(e => e.trim()).filter(Boolean).map((e,i) => ({id:`free-${i}`, name:e, price:0}));
    }

    if (variants?.length) showVariantModal(productId, productName, variants, freeAddons, addons||[]);
    else showAddonsModal(productId, productName, price, freeAddons, addons||[]);
  };

  function showVariantModal(productId, productName, variants, freeAddons, paidAddons) {
    document.getElementById("variantTitle").textContent = productName;
    document.getElementById("variantsBody").innerHTML = variants.map(v => `
      <button class="variant-btn" onclick="selectVariant('${productId}','${productName}','${v.id}','${v.name}',${v.price},${JSON.stringify(freeAddons).replace(/"/g,'&quot;')},${JSON.stringify(paidAddons).replace(/"/g,'&quot;')})">
        ${v.name} — ${v.price.toFixed(3)} د.ب
      </button>
    `).join("");
    openModal("variantModal");
  }

  window.selectVariant = (productId, productName, variantId, variantName, variantPrice, freeAddons, paidAddons) => {
    closeModal("variantModal");
    showAddonsModal(productId, `${productName} (${variantName})`, variantPrice, freeAddons, paidAddons);
  };

  function showAddonsModal(productId, productName, price, freeAddons, paidAddons) {
    currentAddonsData = {productId, productName, price, freeAddons, paidAddons};
    document.getElementById("addonsTitle").textContent = productName;
    document.getElementById("basePrice").textContent = price.toFixed(3) + " د.ب";

    let html = "";
    [...freeAddons, ...paidAddons].forEach(a => {
      html += `<label class="addon-item">
        <input type="checkbox" data-price="${a.price}" data-name="${a.name}" ${a.price===0?'checked':''} onchange="updatePrice(${price})">
        <span class="addon-name">${a.name}</span>
        <span class="addon-price">${a.price?'+'+a.price.toFixed(3)+' د.ب':'مجاني'}</span>
      </label>`;
    });
    document.getElementById("addonsBody").innerHTML = html;
    updatePrice(price);
    openModal("addonsModal");
  }

  window.updatePrice = (basePrice) => {
    let total = basePrice;
    document.querySelectorAll("#addonsBody input:checked").forEach(cb => total += parseFloat(cb.dataset.price)||0);
    document.getElementById("summaryTotal").textContent = total.toFixed(3) + " د.ب";
  };

  window.confirmAddons = () => {
    const addons = [];
    document.querySelectorAll("#addonsBody input:checked").forEach(cb => {
      addons.push({name: cb.dataset.name, price: parseFloat(cb.dataset.price)||0});
    });
    let total = currentAddonsData.price;
    addons.forEach(a => total += a.price);
    closeModal("addonsModal");
    cart.push({...currentAddonsData, price: total, qty: 1, addons});
    saveCart();
    updateBadge();
    showNotif("✅ تمت الإضافة!");
  };

  function saveCart() {
    localStorage.setItem(getCartKey(), JSON.stringify(cart));
  }

  function loadCart() {
    cart = JSON.parse(localStorage.getItem(getCartKey()) || "[]");
    updateBadge();
  }

  function updateBadge() {
    const badge = document.getElementById("badge");
    if (cart.length) {
      badge.textContent = cart.length;
      badge.style.display = "inline-block";
    } else badge.style.display = "none";
  }

  window.showCart = () => {
    if (!cart.length) return showNotif("🛒 فارغة!");
    const total = cart.reduce((s,i) => s + (i.price * i.qty), 0);
    let html = cart.map((i,idx) => `
      <div style="background:#f9fafb; padding:12px; border-radius:8px; margin-bottom:10px;">
        <div style="font-weight:600; margin-bottom:4px;">${i.productName}</div>
        <div style="font-size:12px; color:#666; margin-bottom:8px;">
          ${i.price.toFixed(3)} د.ب
          ${i.addons.length ? `<br>${i.addons.map(a=>a.name).join(', ')}` : ''}
        </div>
        <div style="display:flex; gap:4px;">
          <button onclick="changeQty(${idx},-1)" style="width:28px; height:28px; background:#e5e7eb; border:none; border-radius:4px; cursor:pointer;">−</button>
          <span style="width:28px; text-align:center;">${i.qty}</span>
          <button onclick="changeQty(${idx},1)" style="width:28px; height:28px; background:#e5e7eb; border:none; border-radius:4px; cursor:pointer;">+</button>
          <button onclick="removeItem(${idx})" style="margin-left:auto; background:#fee2e2; color:#dc2626; border:none; padding:4px 8px; border-radius:4px; cursor:pointer; font-size:11px;">❌</button>
        </div>
      </div>
    `).join("");
    html += `<div class="price-summary"><div class="summary-row total"><span>الإجمالي:</span><span>${total.toFixed(3)} د.ب</span></div></div>`;
    document.getElementById("cartBody").innerHTML = html;
    openModal("cartModal");
  };

  window.changeQty = (idx, ch) => {
    cart[idx].qty += ch;
    if (cart[idx].qty <= 0) cart.splice(idx, 1);
    saveCart();
    updateBadge();
    cart.length ? window.showCart() : closeModal("cartModal");
  };

  window.removeItem = (idx) => {
    cart.splice(idx, 1);
    saveCart();
    updateBadge();
    cart.length ? window.showCart() : closeModal("cartModal");
  };

  window.clearCart = () => {
    if (confirm("حذف؟")) {
      cart = [];
      saveCart();
      updateBadge();
      closeModal("cartModal");
    }
  };

  window.goToOrder = () => {
    closeModal("cartModal");
    const total = cart.reduce((s,i) => s + (i.price * i.qty), 0);
    document.getElementById("orderTotal").textContent = total.toFixed(3) + " د.ب";
    openModal("orderModal");
  };

  window.updateDelivery = () => {
    const isDelivery = document.querySelector('input[name="orderType"]:checked').value === "delivery";
    document.getElementById("deliveryGroup").style.display = isDelivery ? "block" : "none";
  };

  window.submitOrder = () => {
    const name = document.getElementById("customerName").value.trim();
    const phone = document.getElementById("customerPhone").value.trim();
    const type = document.querySelector('input[name="orderType"]:checked').value;

    if (!phone) return showNotif("❌ الرقم مطلوب");
    if (type === "delivery" && !document.getElementById("deliveryArea").value) return showNotif("❌ المنطقة مطلوبة");

    let msg = `🍽️ *طلب جديد*\n\n👤 ${name||'بدون'}\n📱 ${phone}\n🏪 ${type==="pickup"?"استلام":"توصيل"}\n\n`;
    cart.forEach(i => {
      msg += `\n🔹 *${i.productName}* ×${i.qty}\n${i.price.toFixed(3)} د.ب`;
      if (i.addons.length) msg += `\nالإضافات: ${i.addons.map(a=>a.name).join(', ')}`;
    });
    const total = cart.reduce((s,i) => s + (i.price * i.qty), 0);
    msg += `\n\n💰 *الإجمالي:* ${total.toFixed(3)} د.ب\n⏰ ${new Date().toLocaleString('ar-EG')}`;

    const restaurantPhone = localStorage.getItem("restaurantPhone");
    if (!restaurantPhone) return showNotif("❌ خطأ في الإعدادات");

    let wa = restaurantPhone.replace(/[\s-]/g, "");
    if (!wa.startsWith("+973")) wa = "+973" + wa.slice(-8);

    window.open(`https://wa.me/${wa}?text=${encodeURIComponent(msg)}`);
    cart = [];
    saveCart();
    updateBadge();
    closeModal("orderModal");
    showNotif("✅ تم الإرسال!");
  };

  function openModal(id) { document.getElementById(id).classList.add("show"); }
  window.closeModal = (id) => { document.getElementById(id).classList.remove("show"); };

  supabase.channel("products").on("postgres_changes", {event:"*", schema:"public", table:"products"}, () => window.location.reload()).subscribe();
</script>

</body>
</html>
