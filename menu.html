<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المنيو - Get-Break</title>
  <link rel="stylesheet" href="style.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #ffffff;
      font-family: 'Arial', sans-serif;
      padding-bottom: 100px;
      direction: rtl;
    }

    /* ========== HEADER ========== */
    .header {
      background: #ffffff;
      color: #111827;
      padding: 16px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e5e5e5;
    }

    .header-title {
      font-size: 18px;
      font-weight: 700;
    }

    .header-right {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .timer-badge {
      background: #10B981;
      color: white;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 13px;
      font-family: 'Courier New', monospace;
    }

    .menu-icon {
      width: 30px;
      height: 30px;
      cursor: pointer;
    }

    /* ========== CONTAINER ========== */
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 0;
    }

    /* ========== FILTERS ========== */
    .filters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 12px 16px;
      background: #f5f5f5;
      -webkit-overflow-scrolling: touch;
    }

    .filter-btn {
      background: #e5e5e5;
      color: #111827;
      border: none;
      padding: 10px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      white-space: nowrap;
      transition: all 0.3s;
      flex-shrink: 0;
    }

    .filter-btn.active {
      background: #D4A574;
      color: #000;
    }

    /* ========== GRID ========== */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding: 16px;
      background: #ffffff;
    }

    .product-card {
      background: #ffffff;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.3s;
    }

    .product-card:hover {
      transform: translateY(-4px);
    }

    .product-img {
      width: 100%;
      height: 120px;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      overflow: hidden;
    }

    .product-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-info {
      padding: 12px;
    }

    .product-name {
      font-weight: 600;
      color: #111827;
      font-size: 14px;
      margin-bottom: 4px;
    }

    .product-price {
      color: #10B981;
      font-weight: 700;
      font-size: 14px;
    }

    /* ========== CART BUTTON ========== */
    .cart-btn {
      position: fixed;
      bottom: 20px;
      left: 20px;
      right: 20px;
      background: #10B981;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      z-index: 50;
      box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3);
    }

    .cart-btn:hover {
      background: #059669;
    }

    .badge {
      display: inline-block;
      background: #EF4444;
      color: white;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      text-align: center;
      line-height: 20px;
      font-weight: 700;
      font-size: 11px;
      margin-right: 8px;
    }

    /* ========== MODAL ========== */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      background: white;
      border-radius: 16px;
      width: 100%;
      max-width: 500px;
      max-height: 85vh;
      overflow-y: auto;
      animation: slideUp 0.3s ease;
    }

    .modal-header {
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid #e5e5e5;
      position: relative;
    }

    .modal-header h2 {
      font-size: 20px;
      color: #111827;
      margin: 0;
    }

    .close-modal {
      position: absolute;
      top: 16px;
      right: 16px;
      background: #e5e5e5;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 18px;
      color: #111827;
    }

    .modal-body {
      padding: 20px;
    }

    /* ========== VARIANTS ========== */
    .variant-btn {
      width: 100%;
      padding: 12px;
      background: #F4C34A;
      color: #000;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      margin-bottom: 10px;
      transition: all 0.3s;
    }

    .variant-btn:hover {
      background: #E0B23A;
    }

    /* ========== ADDONS ========== */
    .addons-section {
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px dashed #d1d5db;
    }

    .addons-section:last-of-type {
      border-bottom: none;
    }

    .section-title {
      font-weight: 700;
      color: #111827;
      font-size: 14px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .addons-label-text {
      color: #6b7280;
      font-size: 12px;
      margin-bottom: 12px;
    }

    .addon-item {
      display: flex;
      align-items: center;
      padding: 12px;
      background: #f9fafb;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .addon-item:hover {
      border-color: #3b82f6;
      background: #eff6ff;
    }

    .addon-item input[type="checkbox"] {
      width: 20px;
      height: 20px;
      cursor: pointer;
      accent-color: #3b82f6;
      margin-left: 12px;
      flex-shrink: 0;
    }

    .addon-name {
      flex: 1;
      color: #111827;
      font-weight: 500;
      font-size: 13px;
    }

    .addon-price {
      color: #10B981;
      font-weight: 600;
      font-size: 12px;
      margin-left: 8px;
    }

    .addon-free {
      background: #f0fdf4 !important;
      border-color: #86efac !important;
    }

    .addon-paid {
      background: #eff6ff !important;
      border-color: #93c5fd !important;
    }

    /* ========== PRICE SUMMARY ========== */
    .price-summary {
      background: #f9fafb;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 20px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      font-size: 13px;
      color: #111827;
    }

    .summary-row.total {
      border-top: 2px solid #e5e7eb;
      padding-top: 10px;
      font-weight: 700;
      font-size: 15px;
    }

    .summary-row.total .price {
      color: #10B981;
    }

    /* ========== BUTTONS ========== */
    .modal-footer {
      padding: 16px 20px;
      display: flex;
      gap: 10px;
      border-top: 1px solid #e5e5e5;
    }

    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      transition: all 0.2s;
    }

    .btn-cancel {
      background: #e5e7eb;
      color: #111827;
    }

    .btn-cancel:hover {
      background: #d1d5db;
    }

    .btn-confirm {
      background: #F4C34A;
      color: #000;
    }

    .btn-confirm:hover {
      background: #E0B23A;
    }

    /* ========== EMPTY & LOADING ========== */
    .empty {
      text-align: center;
      padding: 60px 20px;
      color: #9CA3AF;
    }

    .loading {
      text-align: center;
      padding: 40px 20px;
      color: #6B7280;
    }

    /* ========== ANIMATIONS ========== */
    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ========== RESPONSIVE ========== */
    @media (max-width: 480px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        padding: 12px;
      }

      .product-img {
        height: 100px;
      }

      .modal {
        padding: 0;
      }

      .modal-content {
        border-radius: 12px 12px 0 0;
        max-height: 90vh;
      }
    }
  </style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <span class="header-title">🍽️ المنيو</span>
  <div class="header-right">
    <span class="timer-badge" id="timerBadge">10:00</span>
    <span class="menu-icon">☰</span>
  </div>
</div>

<!-- CONTAINER -->
<div class="container">
  <!-- FILTERS -->
  <div class="filters" id="filters"></div>

  <!-- GRID -->
  <div class="grid" id="grid">
    <div class="loading">⏳ جاري التحميل...</div>
  </div>

  <!-- EMPTY -->
  <div class="empty" id="empty" style="display: none;">📭 لا توجد منتجات</div>
</div>

<!-- CART BUTTON -->
<button class="cart-btn" onclick="showCart()">
  🛒 السلة
  <span class="badge" id="badge" style="display: none;"></span>
</button>

<!-- VARIANTS MODAL -->
<div class="modal" id="variantModal">
  <div class="modal-content">
    <button class="close-modal" onclick="closeModal('variantModal')">✕</button>
    <div class="modal-header">
      <h2 id="variantTitle"></h2>
    </div>
    <div class="modal-body">
      <div id="variantsBody"></div>
    </div>
  </div>
</div>

<!-- ADDONS MODAL -->
<div class="modal" id="addonsModal">
  <div class="modal-content">
    <button class="close-modal" onclick="closeModal('addonsModal')">✕</button>
    <div class="modal-header">
      <h2 id="addonsTitle"></h2>
    </div>
    <div class="modal-body">
      <p style="color: #6B7280; font-size: 13px; margin-bottom: 20px;">
        السعر الأساسي: <strong id="basePrice"></strong>
      </p>

      <div class="addons-section" id="freeAddonsContainer" style="display: none;">
        <div class="section-title">🎁 اختر الإضافات (مجاني)</div>
        <div class="addons-label-text">اختر الإضافات التي لا يريدها الزبون</div>
        <div id="freeAddonsBody"></div>
      </div>

      <div class="addons-section" id="paidAddonsContainer" style="display: none;">
        <div class="section-title">💰 إضافات إضافية</div>
        <div id="paidAddonsBody"></div>
      </div>

      <div class="price-summary">
        <div class="summary-row">
          <span>السعر الأساسي:</span>
          <span id="summaryBase"></span>
        </div>
        <div class="summary-row" id="addonsPriceRow" style="display: none;">
          <span>الإضافات الإضافية:</span>
          <span id="summaryAddons"></span>
        </div>
        <div class="summary-row total">
          <span>الإجمالي:</span>
          <span class="price" id="summaryTotal"></span>
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn btn-cancel" onclick="closeModal('addonsModal')">إلغاء</button>
      <button class="btn btn-confirm" onclick="confirmAddons()">أضف للسلة</button>
    </div>
  </div>
</div>

<!-- CART MODAL -->
<div class="modal" id="cartModal">
  <div class="modal-content">
    <button class="close-modal" onclick="closeModal('cartModal')">✕</button>
    <div class="modal-header">
      <h2>🛒 السلة</h2>
    </div>
    <div class="modal-body" id="cartBody"></div>
    <div class="modal-footer">
      <button class="btn btn-cancel" onclick="clearCart()">مسح</button>
      <button class="btn btn-confirm" onclick="goToOrder()">المتابعة</button>
    </div>
  </div>
</div>

<!-- ORDER MODAL -->
<div class="modal" id="orderModal">
  <div class="modal-content">
    <button class="close-modal" onclick="closeModal('orderModal')">✕</button>
    <div class="modal-header">
      <h2>📋 بيانات الطلب</h2>
    </div>
    <div class="modal-body">
      <div style="margin-bottom: 16px;">
        <label style="display: block; font-weight: 600; margin-bottom: 6px; color: #111827;">الاسم (اختياري)</label>
        <input type="text" id="customerName" placeholder="اسمك" style="width: 100%; padding: 10px; border: 2px solid #e5e7eb; border-radius: 6px; font-size: 13px;">
      </div>

      <div style="margin-bottom: 16px;">
        <label style="display: block; font-weight: 600; margin-bottom: 6px; color: #111827;">رقم الهاتف *</label>
        <input type="tel" id="customerPhone" placeholder="33123456 أو +97333123456" style="width: 100%; padding: 10px; border: 2px solid #e5e7eb; border-radius: 6px; font-size: 13px;">
      </div>

      <div style="margin-bottom: 16px;">
        <label style="display: block; font-weight: 600; margin-bottom: 6px; color: #111827;">نوع الطلب *</label>
        <label style="display: flex; align-items: center; padding: 10px; background: #f9fafb; border: 2px solid #e5e7eb; border-radius: 6px; margin-bottom: 8px; cursor: pointer;">
          <input type="radio" name="orderType" value="pickup" checked onchange="updateDelivery()" style="width: 18px; height: 18px; margin-left: 10px;">
          <span style="flex: 1; color: #111827; font-weight: 500; font-size: 13px;">🚶 استلام من المتجر</span>
        </label>
        <label style="display: flex; align-items: center; padding: 10px; background: #f9fafb; border: 2px solid #e5e7eb; border-radius: 6px; cursor: pointer;">
          <input type="radio" name="orderType" value="delivery" onchange="updateDelivery()" style="width: 18px; height: 18px; margin-left: 10px;">
          <span style="flex: 1; color: #111827; font-weight: 500; font-size: 13px;">🚗 توصيل للعنوان</span>
        </label>
      </div>

      <div id="deliveryGroup" style="display: none; margin-bottom: 16px;">
        <label style="display: block; font-weight: 600; margin-bottom: 6px; color: #111827;">المنطقة *</label>
        <select id="deliveryArea" onchange="updateOrderTotal()" style="width: 100%; padding: 10px; border: 2px solid #e5e7eb; border-radius: 6px; font-size: 13px;">
          <option value="">-- اختر المنطقة --</option>
          <option value="manama">المنامة - 300 فلس</option>
          <option value="budaiya">البديع - 500 فلس</option>
          <option value="other">مناطق أخرى - 1 دينار</option>
        </select>

        <label style="display: block; font-weight: 600; margin-bottom: 6px; color: #111827; margin-top: 12px;">وصف العنوان *</label>
        <textarea id="deliveryAddress" placeholder="رقم المنزل، الشارع، معالم..." rows="3" style="width: 100%; padding: 10px; border: 2px solid #e5e7eb; border-radius: 6px; font-size: 13px; font-family: inherit;"></textarea>
      </div>

      <div style="margin-bottom: 16px;">
        <label style="display: block; font-weight: 600; margin-bottom: 6px; color: #111827;">ملاحظات (اختياري)</label>
        <textarea id="notes" placeholder="مثال: بدون بصل، حار..." rows="2" style="width: 100%; padding: 10px; border: 2px solid #e5e7eb; border-radius: 6px; font-size: 13px; font-family: inherit;"></textarea>
      </div>

      <div class="price-summary">
        <div class="summary-row">
          <span>الطلب:</span>
          <span id="orderItemsTotal"></span>
        </div>
        <div class="summary-row" id="deliveryFeeRow" style="display: none;">
          <span>التوصيل:</span>
          <span id="orderDeliveryFee"></span>
        </div>
        <div class="summary-row total">
          <span>الإجمالي:</span>
          <span class="price" id="orderGrandTotal"></span>
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn btn-cancel" onclick="closeModal('orderModal')">إلغاء</button>
      <button class="btn btn-confirm" onclick="submitOrder()">إرسال الطلب</button>
    </div>
  </div>
</div>

<script type="module">
  import { supabase } from "./supabase.js";

  // ========== SESSION MANAGEMENT ==========
  let sessionId = null;
  let sessionTimer = null;
  const SESSION_TIMEOUT = 10 * 60 * 1000; // 10 دقايق

  function initializeSession() {
    sessionId = generateSessionId();
    console.log("🆔 Session ID:", sessionId);
    sessionStorage.setItem("sessionId", sessionId);
    startSessionTimer();
  }

  function generateSessionId() {
    return 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
  }

  function getCartKey() {
    return `cart_${sessionId}`;
  }

  function startSessionTimer() {
    let timeRemaining = SESSION_TIMEOUT;

    function updateTimerDisplay() {
      const minutes = Math.floor(timeRemaining / 60000);
      const seconds = Math.floor((timeRemaining % 60000) / 1000);
      const display = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

      const timerBadge = document.getElementById("timerBadge");
      if (timerBadge) {
        timerBadge.textContent = display;
        if (minutes === 0 && seconds <= 60) {
          timerBadge.style.background = '#EF4444';
          timerBadge.style.color = 'white';
        }
      }
    }

    updateTimerDisplay();

    sessionTimer = setInterval(() => {
      timeRemaining -= 1000;
      updateTimerDisplay();

      if (timeRemaining <= 0) {
        clearInterval(sessionTimer);
        expireSession();
      }
    }, 1000);
  }

  function expireSession() {
    localStorage.removeItem(getCartKey());
    sessionStorage.removeItem("sessionId");
    cart = [];
    alert("⏰ انتهت مهلة الجلسة (10 دقايق)!\nالرجاء بدء طلب جديد.");
    location.reload();
  }

  // ========== GLOBAL STATE ==========
  let allProducts = [];
  let cart = [];
  let currentAddonsData = {};

  // INIT
  document.addEventListener("DOMContentLoaded", async () => {
    initializeSession();
    await loadProducts();
    loadCart();
  });

  // LOAD PRODUCTS
  async function loadProducts() {
    try {
      const { data, error } = await supabase
        .from("products")
        .select("*")
        .eq("active", true)
        .eq("is_visible", true)
        .order("sort_order");

      if (error) throw error;
      allProducts = data || [];
      renderFilters();
      renderProducts("all");
    } catch (error) {
      console.error("Error:", error);
      document.getElementById("grid").innerHTML = '<div class="empty">❌ خطأ في التحميل</div>';
    }
  }

  // RENDER FILTERS
  function renderFilters() {
    const categories = [...new Set(allProducts.map(p => p.category || "أخرى"))];
    const html = `
      <button class="filter-btn active" onclick="filterProducts('all')">الكل</button>
      ${categories.map(cat => `
        <button class="filter-btn" onclick="filterProducts('${cat}')">${cat}</button>
      `).join("")}
    `;
    document.getElementById("filters").innerHTML = html;
  }

  window.filterProducts = (category) => {
    document.querySelectorAll(".filter-btn").forEach(btn => btn.classList.remove("active"));
    event.target.classList.add("active");
    renderProducts(category);
  };

  // RENDER PRODUCTS
function renderProducts(category) {
  let products = allProducts;
  if (category !== "all") {
    products = products.filter(p => p.category === category);
  }

  if (products.length === 0) {
    document.getElementById("grid").style.display = "none";
    document.getElementById("empty").style.display = "block";
    return;
  }

  document.getElementById("grid").style.display = "grid";
  document.getElementById("empty").style.display = "none";

  const html = products.map(p => `
    <div class="product-card" onclick="addToCart('${p.id}', '${p.name || "صنف بدون اسم"}', ${p.price || 0})">
      <div class="product-img">
        ${p.image_url ? `<img src="${p.image_url}">` : "🍽️"}
      </div>
      <div class="product-info">
        <div class="product-name">${p.name || "صنف بدون اسم"}</div>
        <div class="product-price">${(p.price || 0).toFixed(3)} د.ب</div>
      </div>
    </div>
  `).join("");

  document.getElementById("grid").innerHTML = html;
}

  // ADD TO CART
  window.addToCart = async (productId, productName, price) => {   productName = productName || "صنف بدون اسم";  // ✅ تأكد من الاسم
    try {
      const { data: variants } = await supabase
        .from("product_variants")
        .select("*")
        .eq("product_id", productId)
        .eq("active", true);

      const { data: paidAddons } = await supabase
        .from("product_addons")
        .select("*")
        .eq("product_id", productId)
        .eq("active", true);

      const { data: product } = await supabase
        .from("products")
        .select("extras_list")
        .eq("id", productId)
        .single();

      let freeAddons = [];
      if (product?.extras_list) {
        try {
          let extras = product.extras_list
            .split("\n")
            .map(e => e.trim())
            .filter(Boolean);

          freeAddons = extras.map((e, i) => ({
            id: `free-${i}`,
            name: e,
            price: 0
          }));
        } catch (e) {
          console.error("Error parsing extras:", e);
        }
      }

      if (variants?.length > 0) {
        showVariantModal(productId, productName, variants, freeAddons, paidAddons || []);
      } else {
        showAddonsModal(productId, productName, price, freeAddons, paidAddons || []);
      }
    } catch (error) {
      console.error("Error:", error);
      addItemToCart(productId, productName, price, []);
    }
  };

  // VARIANT MODAL
  function showVariantModal(productId, productName, variants, freeAddons, paidAddons) {
    document.getElementById("variantTitle").textContent = productName;
    const html = variants
      .map(v => `
        <button class="variant-btn" onclick="selectVariant('${productId}', '${productName}', '${v.id}', '${v.name}', ${v.price}, ${JSON.stringify(freeAddons).replace(/"/g, '&quot;')}, ${JSON.stringify(paidAddons).replace(/"/g, '&quot;')})">
          ${v.name} — ${v.price.toFixed(3)} د.ب
        </button>
      `)
      .join("");
    document.getElementById("variantsBody").innerHTML = html;
    openModal("variantModal");
  }

  window.selectVariant = (productId, productName, variantId, variantName, variantPrice, freeAddons, paidAddons) => {
    closeModal("variantModal");
    const fullName = `${productName} (${variantName})`;
    showAddonsModal(productId, fullName, variantPrice, freeAddons, paidAddons);
  };

  // ADDONS MODAL
  function showAddonsModal(productId, productName, price, freeAddons, paidAddons) {
    currentAddonsData = {
      productId,
      productName,
      price,
      freeAddons: freeAddons || [],
      paidAddons: paidAddons || []
    };

    document.getElementById("addonsTitle").textContent = productName;
    document.getElementById("basePrice").textContent = price.toFixed(3) + " د.ب";
    document.getElementById("summaryBase").textContent = price.toFixed(3) + " د.ب";

    if (freeAddons.length > 0) {
      const freeHtml = freeAddons.map(a => `
        <label class="addon-item addon-free">
          <input type="checkbox" data-price="0" data-name="${a.name}" onchange="updateAddonsPrice(${price})" checked>
          <span class="addon-name">${a.name}</span>
          <span class="addon-price">مجاني</span>
        </label>
      `).join("");
      document.getElementById("freeAddonsBody").innerHTML = freeHtml;
      document.getElementById("freeAddonsContainer").style.display = "block";
    } else {
      document.getElementById("freeAddonsContainer").style.display = "none";
    }

    if (paidAddons.length > 0) {
      const paidHtml = paidAddons.map(a => `
        <label class="addon-item addon-paid">
          <input type="checkbox" data-price="${a.price}" data-name="${a.name}" onchange="updateAddonsPrice(${price})">
          <span class="addon-name">${a.name}</span>
          <span class="addon-price">+${a.price.toFixed(3)} د.ب</span>
        </label>
      `).join("");
      document.getElementById("paidAddonsBody").innerHTML = paidHtml;
      document.getElementById("paidAddonsContainer").style.display = "block";
    } else {
      document.getElementById("paidAddonsContainer").style.display = "none";
    }

    updateAddonsPrice(price);
    openModal("addonsModal");
  }

  window.updateAddonsPrice = (basePrice) => {
    const allAddons = document.querySelectorAll("#freeAddonsBody input, #paidAddonsBody input");
    let addonsTotal = 0;

    allAddons.forEach(cb => {
      if (cb.checked) {
        addonsTotal += parseFloat(cb.dataset.price) || 0;
      }
    });

    const total = basePrice + addonsTotal;
    document.getElementById("summaryAddons").textContent = addonsTotal.toFixed(3) + " د.ب";
    document.getElementById("addonsPriceRow").style.display = addonsTotal > 0 ? "flex" : "none";
    document.getElementById("summaryTotal").textContent = total.toFixed(3) + " د.ب";
  };

  window.confirmAddons = () => {
    const allAddons = document.querySelectorAll("#freeAddonsBody input, #paidAddonsBody input");
    const addons = [];

    allAddons.forEach(cb => {
      if (cb.checked) {
        addons.push({
          name: cb.dataset.name,
          price: parseFloat(cb.dataset.price) || 0
        });
      }
    });

    let total = currentAddonsData.price;
    addons.forEach(a => { total += a.price; });

    closeModal("addonsModal");
    addItemToCart(currentAddonsData.productId, currentAddonsData.productName, total, addons);
  };

  // CART
  function addItemToCart(productId, productName, price, addons) {
    cart.push({ productId, productName, price, qty: 1, addons });
    saveCart();
    updateBadge();
    alert("✅ تمت الإضافة للسلة!");
  }

  function saveCart() {
    localStorage.setItem(getCartKey(), JSON.stringify(cart));
  }

  function loadCart() {
    const saved = localStorage.getItem(getCartKey());
    cart = saved ? JSON.parse(saved) : [];
    updateBadge();
  }

  function updateBadge() {
    const badge = document.getElementById("badge");
    if (cart.length > 0) {
      badge.textContent = cart.length;
      badge.style.display = "inline-block";
    } else {
      badge.style.display = "none";
    }
  }

  window.showCart = () => {
    if (cart.length === 0) {
      alert("🛒 السلة فارغة!");
      return;
    }

    const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
    let html = '<div style="margin-bottom: 20px;">';

    cart.forEach((item, idx) => {
      html += `
        <div style="background: #f9fafb; padding: 12px; border-radius: 8px; margin-bottom: 10px;">
          <div style="font-weight: 600; color: #111827; margin-bottom: 4px;">${item.productName}</div>
          <div style="font-size: 12px; color: #6b7280; margin-bottom: 8px;">
            السعر: ${item.price.toFixed(3)} د.ب
            ${item.addons.length > 0 ? `<br>الإضافات: ${item.addons.map(a => a.name).join(", ")}` : ""}
          </div>
          <div style="display: flex; gap: 4px; align-items: center;">
            <button onclick="changeQty(${idx}, -1)" style="width: 28px; height: 28px; background: #e5e7eb; border: none; border-radius: 4px; cursor: pointer;">−</button>
            <span style="width: 28px; text-align: center; font-weight: 600;">${item.qty}</span>
            <button onclick="changeQty(${idx}, 1)" style="width: 28px; height: 28px; background: #e5e7eb; border: none; border-radius: 4px; cursor: pointer;">+</button>
            <button onclick="removeItem(${idx})" style="margin-left: auto; background: #fee2e2; color: #dc2626; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 11px;">❌ حذف</button>
          </div>
        </div>
      `;
    });

    html += '</div>';
    html += `
      <div class="price-summary">
        <div class="summary-row total">
          <span>الإجمالي:</span>
          <span class="price">${total.toFixed(3)} د.ب</span>
        </div>
      </div>
    `;

    document.getElementById("cartBody").innerHTML = html;
    openModal("cartModal");
  };

  window.changeQty = (idx, change) => {
    cart[idx].qty += change;
    if (cart[idx].qty <= 0) cart.splice(idx, 1);
    saveCart();
    updateBadge();
    cart.length > 0 ? window.showCart() : closeModal("cartModal");
  };

  window.removeItem = (idx) => {
    cart.splice(idx, 1);
    saveCart();
    updateBadge();
    cart.length > 0 ? window.showCart() : closeModal("cartModal");
  };

  window.clearCart = () => {
    if (confirm("هل أنت متأكد؟")) {
      cart = [];
      saveCart();
      updateBadge();
      closeModal("cartModal");
    }
  };

  window.goToOrder = () => {
    closeModal("cartModal");
    updateOrderTotal();
    openModal("orderModal");
  };

  // ORDER
  window.updateDelivery = () => {
    const isDelivery = document.querySelector('input[name="orderType"]:checked').value === "delivery";
    document.getElementById("deliveryGroup").style.display = isDelivery ? "block" : "none";
    updateOrderTotal();
  };

  function getDeliveryFee() {
    const area = document.getElementById("deliveryArea").value;
    if (area === "manama") return 0.3;
    if (area === "budaiya") return 0.5;
    if (area === "other") return 1;
    return 0;
  }

  window.updateOrderTotal = () => {
    const itemsTotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
    const isDelivery = document.querySelector('input[name="orderType"]:checked').value === "delivery";
    const fee = isDelivery ? getDeliveryFee() : 0;
    const grandTotal = itemsTotal + fee;

    document.getElementById("orderItemsTotal").textContent = itemsTotal.toFixed(3) + " د.ب";
    document.getElementById("orderDeliveryFee").textContent = fee.toFixed(3) + " د.ب";
    document.getElementById("orderGrandTotal").textContent = grandTotal.toFixed(3) + " د.ب";

    if (isDelivery) {
      document.getElementById("deliveryFeeRow").style.display = "flex";
    } else {
      document.getElementById("deliveryFeeRow").style.display = "none";
    }
  };

  window.submitOrder = async () => {
    const name = document.getElementById("customerName").value.trim();
    const phone = document.getElementById("customerPhone").value.trim();
    const type = document.querySelector('input[name="orderType"]:checked').value;
    const notes = document.getElementById("notes").value.trim();

    if (!phone || !/^(\d{7,8}|\+973\d{8})$/.test(phone.replace(/[\s-]/g, ""))) {
      alert("❌ رقم الهاتف غير صحيح");
      return;
    }

    if (type === "delivery") {
      const area = document.getElementById("deliveryArea").value;
      const address = document.getElementById("deliveryAddress").value.trim();
      if (!area || !address) {
        alert("❌ الرجاء ملء بيانات التوصيل");
        return;
      }
    }

    const itemsTotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
    const fee = type === "delivery" ? getDeliveryFee() : 0;
    const grandTotal = itemsTotal + fee;

    if (!confirm(`✓ تأكيد الطلب؟\nالإجمالي: ${grandTotal.toFixed(3)} د.ب`)) return;

    let msg = `🍽️ *طلب جديد من المنيو*\n\n`;
    msg += `👤 *اسم الكستمر:* ${name || "بدون اسم"}\n`;
    msg += `📱 *رقم الكستمر:* ${phone}\n`;
    msg += `🏪 *نوع الطلب:* ${type === "pickup" ? "🚶 استلام من المتجر" : "🚗 توصيل للعنوان"}\n`;
    msg += `\n`;
    msg += `*📦 تفاصيل الطلب:*\n`;
    msg += `━━━━━━━━━━━━━━━━━━━━\n`;

    cart.forEach(item => {
      msg += `\n🔹 *${item.productName}*\n`;
      msg += `   الكمية: ${item.qty}\n`;
      msg += `   السعر: ${item.price.toFixed(3)} د.ب\n`;
      msg += `   الإجمالي: ${(item.price * item.qty).toFixed(3)} د.ب\n`;

      if (item.addons && item.addons.length > 0) {
        msg += `   الإضافات:\n`;
        item.addons.forEach(addon => {
          if (addon.price > 0) {
            msg += `     • ${addon.name} (+${addon.price.toFixed(3)} د.ب)\n`;
          } else {
            msg += `     • ${addon.name}\n`;
          }
        });
      }
    });

    msg += `\n━━━━━━━━━━━━━━━━━━━━\n`;
    msg += `💰 *الإجمالي:* ${itemsTotal.toFixed(3)} د.ب\n`;

    if (type === "delivery") {
      const areaText = document.getElementById("deliveryArea").options[document.getElementById("deliveryArea").selectedIndex].text;
      msg += `🚗 *رسم التوصيل:* ${fee.toFixed(3)} د.ب\n`;
      msg += `📍 *المنطقة:* ${areaText}\n`;
      msg += `🏠 *العنوان:* ${document.getElementById("deliveryAddress").value}\n`;
    }

    msg += `\n💵 *المجموع النهائي:* ${grandTotal.toFixed(3)} د.ب\n`;

    if (notes) {
      msg += `\n📝 *ملاحظات:* ${notes}\n`;
    }

    msg += `\n━━━━━━━━━━━━━━━━━━━━\n`;
    msg += `✅ تم الطلب بواسطة منيو QR\n`;
    msg += `⏰ الوقت: ${new Date().toLocaleString('ar-EG')}\n`;

    const restaurantPhone = localStorage.getItem("restaurantPhone");

    if (!restaurantPhone) {
      alert("❌ خطأ: لم يتم تعيين رقم المطعم!\nالرجاء التواصل مع الإدارة.");
      return;
    }

    let wa = restaurantPhone.replace(/[\s-]/g, "");
    if (!wa.startsWith("+973")) wa = "+973" + wa.slice(-8);

    // بدل إرسال WhatsApp مباشرة، احفظ في pending_orders
const orderData = {
  customer_name: name,
  customer_phone: phone,
  order_items: cart,
  delivery_type: type,
  delivery_area: type === "delivery" ? document.getElementById("deliveryArea").value : null,
  delivery_address: type === "delivery" ? document.getElementById("deliveryAddress").value : null,
  notes: notes,
  total_price: grandTotal,
  status: "pending",
  restaurant_id: restaurantPhone,
  created_at: new Date().toISOString()
};

try {
  const { data: insertedOrder, error } = await supabase
    .from("pending_orders")
    .insert([orderData])
    .select();

  if (error) throw error;

  // طبعاً احفظ في WhatsApp بس بشكل مختلف (اختياري - إرسال تنبيه)
  // window.open(`https://wa.me/${wa}?text=${encodeURIComponent(msg)}`, "_blank");

  cart = [];
  saveCart();
  updateBadge();
  closeModal("orderModal");
  alert("✅ تم الطلب! جاري المعالجة...");
} catch (error) {
  console.error("Error submitting order:", error);
  alert("❌ خطأ في إرسال الطلب: " + error.message);
}

  };

  // MODAL
  function openModal(id) {
    document.getElementById(id).classList.add("show");
  }

  window.closeModal = (id) => {
    document.getElementById(id).classList.remove("show");
  };

  // Subscribe
  supabase
    .channel("products")
    .on("postgres_changes", { event: "*", schema: "public", table: "products" }, () => loadProducts())
    .subscribe();
</script>
