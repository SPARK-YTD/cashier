<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>Driver Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ✅ PWA: يسمح للسايق يثبّت الصفحة على شاشته الرئيسية (Android: تثبيت حقيقي،
       iOS: يفتح بدون شريط المتصفح - يحسّن ثبات تتبع الموقع شوي) -->
  <link rel="manifest" href="delivery-manifest.json">
  <meta name="theme-color" content="#0F172A">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ديلفري">
  <link rel="apple-touch-icon" href="logo.png">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .lang-switcher {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
    }

    .lang-btn {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid #ddd;
      background: white;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
    }

    .lang-btn.active {
      background: #F59E0B;
      color: white;
      border-color: #F59E0B;
    }

    .login-box {
      background: white;
      padding: 30px;
      border-radius: 12px;
      width: 320px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid #ddd;
      font-size: 16px;
      box-sizing: border-box;
    }

    button.submit-btn {
      width: 100%;
      padding: 10px;
      background: #F59E0B;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      font-weight: 700;
    }

    button.submit-btn:hover {
      opacity: 0.9;
    }

    .error {
      color: red;
      text-align: center;
      margin-top: 10px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="lang-switcher" id="langSwitcher"></div>

  <div class="login-box">
    <h2 data-i18n="login_title">🚚 دخول الديلفري</h2>

    <input type="text" id="deliveryUsername" data-i18n-placeholder="username_ph" placeholder="اسم المستخدم" />
    <input type="password" id="deliveryPin" data-i18n-placeholder="password_ph" placeholder="كلمة المرور" />

    <button class="submit-btn" data-i18n="login_btn" onclick="loginDelivery()">دخول</button>

    <div id="errorMsg" class="error"></div>
  </div>

  <script type="module" src="delivery-auth.js"></script>
</body>
</html>
