<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>أرشيف التقارير</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: #F8FAFC;
    }

    .reports-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    .header {
      background: linear-gradient(135deg, #0F172A, #1E293B);
      color: white;
      padding: 30px;
      border-radius: 16px;
      margin-bottom: 30px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 800;
    }

    /* =============== FILTERS =============== */
    .filters-section {
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      margin-bottom: 24px;
    }

    .filters-section h2 {
      margin-top: 0;
      margin-bottom: 16px;
      font-size: 16px;
      font-weight: 700;
      color: #0F172A;
    }

    .filter-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 16px;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
    }

    .filter-group label {
      font-weight: 600;
      font-size: 13px;
      color: #475569;
      margin-bottom: 6px;
    }

    .filter-group input,
    .filter-group select {
      padding: 10px 12px;
      border: 1px solid #E2E8F0;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      direction: rtl;
    }

    .filter-group input:focus,
    .filter-group select:focus {
      outline: none;
      border-color: #3B82F6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .filter-buttons {
      display: flex;
      gap: 12px;
      justify-content: flex-start;
    }

    .btn-primary {
      background: #3B82F6;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    .btn-primary:hover {
      background: #2563EB;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }

    .btn-secondary {
      background: #E2E8F0;
      color: #0F172A;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.3s ease;
    }

    .btn-secondary:hover {
      background: #CBD5E1;
    }

    /* =============== SUMMARY =============== */
    .summary-section {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .summary-card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      text-align: center;
      border-top: 4px solid #3B82F6;
    }

    .summary-card.sales {
      border-top-color: #10B981;
    }

    .summary-card.orders {
      border-top-color: #F59E0B;
    }

    .summary-card.days {
      border-top-color: #8B5CF6;
    }

    .summary-label {
      font-size: 12px;
      color: #64748B;
      font-weight: 600;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .summary-value {
      font-size: 28px;
      font-weight: 800;
      color: #0F172A;
    }

    /* =============== TABLE =============== */
    .table-section {
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      overflow: hidden;
    }

    .table-title {
      padding: 16px 24px;
      border-bottom: 1px solid #E2E8F0;
      font-size: 16px;
      font-weight: 700;
      color: #0F172A;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    table thead {
      background: #F1F5F9;
      border-bottom: 2px solid #E2E8F0;
    }

    table th {
      padding: 16px;
      text-align: right;
      font-weight: 700;
      font-size: 13px;
      color: #475569;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    table td {
      padding: 14px 16px;
      border-bottom: 1px solid #E2E8F0;
      font-size: 14px;
      color: #0F172A;
    }

    table tbody tr:hover {
      background: #F8FAFC;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .btn-action {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 18px;
      padding: 4px 8px;
      transition: transform 0.2s ease;
    }

    .btn-action:hover {
      transform: scale(1.2);
    }

    .btn-action.delete {
      color: #EF4444;
    }

    .btn-action.view {
      color: #3B82F6;
    }

    .btn-action.print {
      color: #10B981;
    }

    /* =============== EMPTY STATE =============== */
    .empty-state {
      padding: 60px 20px;
      text-align: center;
      color: #64748B;
    }

    .empty-state p {
      margin: 0;
      font-size: 16px;
    }

    /* =============== RESPONSIVE =============== */
    @media (max-width: 768px) {
      .filter-grid {
        grid-template-columns: 1fr;
      }

      .summary-section {
        grid-template-columns: 1fr;
      }

      table th,
      table td {
        padding: 10px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <h1>📊 أرشيف التقارير</h1>
</div>

<div class="reports-container">

  <!-- FILTERS -->
  <div class="filters-section">
    <h2>🔍 الفلاتر</h2>
    
    <div class="filter-grid">
      <div class="filter-group">
        <label for="dateFrom">من التاريخ</label>
        <input type="date" id="dateFrom">
      </div>

      <div class="filter-group">
        <label for="dateTo">إلى التاريخ</label>
        <input type="date" id="dateTo">
      </div>

      <div class="filter-group">
        <label for="month">الشهر</label>
        <select id="month">
          <option value="">جميع الأشهر</option>
          <option value="1">يناير</option>
          <option value="2">فبراير</option>
          <option value="3">مارس</option>
          <option value="4">أبريل</option>
          <option value="5">مايو</option>
          <option value="6">يونيو</option>
          <option value="7">يوليو</option>
          <option value="8">أغسطس</option>
          <option value="9">سبتمبر</option>
          <option value="10">أكتوبر</option>
          <option value="11">نوفمبر</option>
          <option value="12">ديسمبر</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="year">السنة</label>
        <select id="year">
          <option value="">جميع السنوات</option>
          <option value="2026">2026</option>
          <option value="2025">2025</option>
          <option value="2024">2024</option>
        </select>
      </div>
    </div>

    <div class="filter-buttons">
      <button class="btn-primary" onclick="applyFilters()">🔍 بحث</button>
      <button class="btn-secondary" onclick="resetFilters()">🔄 إعادة تعيين</button>
    </div>
  </div>

  <!-- SUMMARY -->
  <div class="summary-section">
    <div class="summary-card sales">
      <div class="summary-label">إجمالي المبيعات</div>
      <div class="summary-value" id="totalSales">0.000</div>
      <div style="font-size: 12px; color: #64748B; margin-top: 4px;">د.ب</div>
    </div>

    <div class="summary-card orders">
      <div class="summary-label">عدد الطلبات</div>
      <div class="summary-value" id="totalOrders">0</div>
    </div>

    <div class="summary-card days">
      <div class="summary-label">عدد الأيام</div>
      <div class="summary-value" id="totalDays">0</div>
    </div>
  </div>

  <!-- TABLE -->
  <div class="table-section">
    <div class="table-title">📋 التقارير</div>
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th style="width: 12%;">التاريخ</th>
            <th style="width: 12%;">الطلبات</th>
            <th style="width: 15%;">المبيعات</th>
            <th style="width: 15%;">المتوسط</th>
            <th style="width: 15%;">الكاش / كارت</th>
            <th style="width: 15%;">الموظفون</th>
            <th style="width: 16%;">الإجراءات</th>
          </tr>
        </thead>
        <tbody id="reportsTable">
          <tr>
            <td colspan="7" style="text-align: center; padding: 40px;">
              ⏳ جاري تحميل البيانات...
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<script type="module" src="reports.js"></script>

</body>
</html>
